<!DOCTYPE html>
<html lang="es">
<head>

            display: flex;
            align-items: center;

            min-height: 100vh;

        }
        a {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 25px;
            text-decoration: none;
            margin-top: 1rem;
            transition: background 0.3s;
        }
        a:hover {

        }
