<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reporte de Cambios de Precio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
  <link href="main.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">
    <div class="main-header mb-4">
      <h2><i class="bi bi-arrow-left-right"></i> Cambios de Precio</h2>
      <p class="subtitle">Lista de variantes con mayor descuento o encarecimiento actual</p>
    </div>
    <div class="products-container">
      <div class="row mb-3">
        <div class="col-md-6">
          <label for="changeType" class="form-label">Tipo de cambio a mostrar:</label>
          <select id="changeType" class="form-select" style="max-width: 300px;">
            <option value="discount" selected>Descuentos actuales</option>
            <option value="increase">Encarecimientos actuales</option>
          </select>
        </div>
      </div>
      <div id="productsList"></div>
      <div id="paginationContainer" class="pagination-container d-none">
        <button id="loadMoreBtn" class="btn load-more-btn">
          <i class="bi bi-plus-circle me-2"></i>Cargar más
        </button>
        <div id="paginationInfo" class="pagination-info"></div>
      </div>
    </div>
    <div id="loading" class="loading-container">
      <div class="spinner-border spinner-border-custom text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
      <p class="mt-3 text-muted">Cargando datos de precios...</p>
    </div>
    <div id="error" class="alert alert-danger alert-custom d-none mt-4" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      <span id="errorMessage"></span>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <script src="price_change_report.js"></script>
</body>
</html>
