name: Daily Price Update

on:
  schedule:
    # Run daily at 10:00 PM Costa Rica (4:00 AM UTC) Monday-Saturday
    - cron: '0 4 * * 1-6'
  workflow_dispatch: # Allow manual trigger

jobs:
  daily-scrape:
    runs-on: ubuntu-latest
    strategy:
      matrix: #8
        segment: [1, 2, 3, 4, 5, 6, 7, 8]
    permissions:
      contents: write  # Required to commit and push database changes
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Decompress database
        run: |
          if [ -f prices.db.gz ]; then
            gunzip -k prices.db.gz
            echo "✓ Database decompressed"
          else
            echo "⚠ No compressed database found, starting fresh"
          fi
      
      - name: Optimize database (pre-scrape)
        run: node optimize_db.js
      
      - name: Run scraper (daily mode - segment ${{ matrix.segment }})
        run: node scraper.js --mode=daily --segments=8 --segment=${{ matrix.segment }}
      
      - name: Upload segment database
        uses: actions/upload-artifact@v4
        with:
          name: prices-segment-${{ matrix.segment }}
          path: prices-${{ matrix.segment }}.db
          retention-days: 1

  merge-and-finalize:
    needs: daily-scrape
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to commit and push database changes
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Download all segment databases
        uses: actions/download-artifact@v4
        with:
          pattern: prices-segment-*
          merge-multiple: true
      
      - name: Decompress existing database
        run: |
          if [ -f prices.db.gz ]; then
            gunzip -k prices.db.gz
            echo "✓ Existing database decompressed for merge"
          else
            echo "⚠ No existing database found, starting fresh"
          fi
      
      - name: Merge segment databases
        run: node merge_db.js
      
      - name: Optimize database (post-merge)
        run: node optimize_db.js
      
      - name: Compress database
        run: node compress_db.js
      
      - name: Commit and push compressed database
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add prices.db.gz
          git diff --quiet && git diff --staged --quiet || git commit -m "Daily price update - $(date +'%Y-%m-%d')"
          git push
