name: Weekly Discovery & Recovery

on:
  schedule:
    # Run weekly on Sundays at 10:00 PM Costa Rica (4:00 AM UTC)
    - cron: '0 4 * * 0'
  workflow_dispatch: # Allow manual trigger

jobs:
  # Reporte independiente que corre en paralelo
  pre-scrape-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Generate sitemap report
        run: |
          echo "📋 Generating pre-scrape sitemap report..."
          node report_sitemap_products.js > sitemap-report.txt
          cat sitemap-report.txt
      
      - name: Upload sitemap report
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-report
          path: sitemap-report.txt
          retention-days: 7

  weekly-discovery:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        segment: [1, 2, 3, 4, 5, 6, 7, 8]
    permissions:
      contents: write  # Required to commit and push database changes
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Decompress database
        run: |
          if [ -f prices.db.gz ]; then
            gunzip -k prices.db.gz
            echo "✓ Database decompressed"
          else
            echo "⚠ No compressed database found, starting fresh"
          fi
      
      - name: Optimize database (pre-scrape)
        run: node optimize_db.js
      
      - name: Run scraper (weekly mode - segment ${{ matrix.segment }})
        run: node scraper.js --mode=weekly --segments=8 --segment=${{ matrix.segment }}
      
      - name: Upload segment database
        uses: actions/upload-artifact@v4
        with:
          name: prices-segment-${{ matrix.segment }}
          path: prices-${{ matrix.segment }}.db
          retention-days: 1

  merge-and-finalize:
    needs: weekly-discovery
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to commit and push database changes
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Validate existing database
        run: |
          if [ ! -f prices.db.gz ]; then
            echo "❌ ERROR: prices.db.gz not found in repository"
            echo "Cannot perform incremental merge without existing database"
            exit 1
          fi
          echo "✓ Existing database found"
      
      - name: Decompress existing database for incremental merge
        run: |
          gunzip -k prices.db.gz
          echo "✓ Existing database decompressed for merge"
          ls -lh prices.db
      
      - name: Download all segment databases
        uses: actions/download-artifact@v4
        with:
          pattern: prices-segment-*
          merge-multiple: true
      
      - name: Merge segment databases
        run: node merge_db.js
      
      - name: Optimize database (post-merge)
        run: node optimize_db.js
      
      - name: Generate post-scrape report
        run: |
          echo "📊 Generating post-scrape results report..."
          node report_scrape_results.js > scrape-results-report.txt
          cat scrape-results-report.txt
      
      - name: Upload scrape results report
        uses: actions/upload-artifact@v4
        with:
          name: scrape-results-report
          path: scrape-results-report.txt
          retention-days: 7
      
      - name: Compress database
        run: node compress_db.js
      
      - name: Commit and push compressed database
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add prices.db.gz
          
          # Add reports to commit if they exist
          if [ -f scrape-results-report.txt ]; then
            git add scrape-results-report.txt
          fi
          
          git diff --quiet && git diff --staged --quiet || git commit -m "Weekly discovery & recovery - $(date +'%Y-%m-%d')"
          git push
